apiVersion: trainer.kubeflow.org/v1alpha1
kind: ClusterTrainingRuntime
metadata:
  name: remote
  labels:
    trainer.kubeflow.org/framework: remote
spec:
  mlPolicy:
    numNodes: 1
  template:
    spec:
      replicatedJobs:
        - name: node
          template:
            metadata:
              labels:
                trainer.kubeflow.org/trainjob-ancestor-step: trainer
            spec:
              template:
                spec:
                  restartPolicy: Never
                  containers:
                    - name: node
                      image: remote-trainer:latest
                      imagePullPolicy: Never
                      env:
                      # Script from remote runtime plugin (ConfigMap mount)
                        - name: SCRIPT_PATH
                          value: "/app/script.py"

                        - name: client_id
                          valueFrom:
                            secretKeyRef:
                              name: firecrest-secret
                              key: client_id
                        - name: client_secret
                          valueFrom:
                            secretKeyRef:
                              name: firecrest-secret
                              key: client_secret
                        - name: token_uri
                          valueFrom:
                            secretKeyRef:
                              name: firecrest-secret
                              key: token_uri
                        - name: firecrest_url
                          valueFrom:
                            secretKeyRef:
                              name: firecrest-secret
                              key: firecrest_url
                        - name: machine
                          valueFrom:
                            secretKeyRef:
                              name: firecrest-secret
                              key: machine
                        - name: remote_path
                          valueFrom:
                            secretKeyRef:
                              name: firecrest-secret
                              key: remote_path
                        - name: account
                          valueFrom:
                            secretKeyRef:
                              name: firecrest-secret
                              key: account
                              optional: true

                  #     # SSH credentials provided via env + mounted secret
                  #     env:
                  #       - name: SSH_HOST
                  #         value: "128.214.252.69" # CHANGE THIS
                  #       - name: SSH_USER
                  #         value: "ubuntu" # CHANGE THIS
                  #       - name: SSH_PORT
                  #         value: "22"
                  #       - name: SSH_KEY_PATH
                  #         value: "/ssh/id_rsa"

                  #     volumeMounts:
                  #       - name: remote-ssh-key
                  #         mountPath: "/ssh"
                  #         readOnly: true

                  # volumes:
                  #   - name: remote-ssh-key
                  #     secret:
                  #       secretName: remote-ssh-key
                  #       defaultMode: 0400
